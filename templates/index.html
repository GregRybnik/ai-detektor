<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Detektor AI – Analiza Twojego tekstu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            transition: all 0.3s ease;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            margin-bottom: 1rem;
            border-radius: 8px;
        }
        input[type="file"] {
            margin-bottom: 1rem;
        }
        .dark-mode {
            background-color: #121212;
            color: #f1f1f1;
        }
        .dark-mode .container {
            background-color: #1f1f1f;
            color: #f1f1f1;
        }
        .dark-mode textarea,
        .dark-mode input[type="file"] {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
        }
        .dark-mode h2,
        .dark-mode label,
        .dark-mode p,
        .dark-mode .result,
        .dark-mode footer,
        .dark-mode a {
            color: #f1f1f1 !important;
        }
        .dark-mode button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .result {
            font-weight: bold;
            margin-top: 1rem;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9em;
        }
        #toggle-theme {
            float: right;
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <form method="POST" enctype="multipart/form-data">
            <button id="toggle-theme">🌙</button>
            <h2>Detektor AI – analiza tekstu</h2>

            <label for="text">Wklej tekst lub prześlij plik Word (.docx)</label>
            <textarea name="text" placeholder="Wklej tutaj tekst...">{{ text }}</textarea>

            <p>Lub wybierz plik Word (.docx):</p>
            <input type="file" name="file" accept="application/vnd.openxmlformats-officedocument.wordprocessingml.document">

            <div>
                <button type="submit">Analizuj</button>
                <button type="submit" name="clear" value="1">Zeruj wyniki</button>
                <a href="/logout" style="float:right">Wyloguj</a>
            </div>

            {% if wynik %}
                <p class="result" style="color: {{ kolor }}">Wynik analizy: {{ wynik }}</p>
                <p>Perplexity: {{ perplexity }}</p>
                <p>Burstiness: {{ burstiness }}</p>
            {% endif %}
        </form>

        <footer>
            2025, Copyright(c), GB
        </footer>
    </div>

    <script>
        const userPrefersDark = localStorage.getItem("theme") === "dark";
        if (userPrefersDark) {
            document.body.classList.add("dark-mode");
            document.getElementById("toggle-theme").innerText = "☀️";
        }

        document.getElementById("toggle-theme").addEventListener("click", function(e) {
            e.preventDefault();
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            this.innerText = isDark ? "☀️" : "🌙";
        });
    </script>
</body>
</html>
