<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Detektor AI – Analiza Twojego tekstu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            padding: 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1.title {
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        textarea, select, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 1rem;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 0.5rem;
        }
        button {
            padding: 0.75rem 1.2rem;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 1em;
            margin-right: 0.5rem;
        }
        a.logout {
            float: right;
            font-size: 0.95em;
            margin-top: 0.5rem;
        }
        .result {
            font-weight: bold;
            margin-top: 1rem;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            button, textarea, select, input[type="file"] {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">AI Detector<br>System analizy tekstu</h1>

        <form method="POST" enctype="multipart/form-data">
            <h2>AI Detektor – analiza Twojego tekstu</h2>

            <label for="text">Wklej tekst lub prześlij plik Word (.docx)</label>
            <textarea name="text" placeholder="Wklej tutaj tekst...">{{ text }}</textarea>

            <label for="file">Lub wybierz plik Word (.docx):</label>
            <input type="file" name="file" accept=".docx">

            <!-- Przeniesiony opis modelu pod plik -->
            <label for="model">Wybierz model analizy:</label>
            <select name="model" id="model">
                <option value="distilgpt2" {% if model_name == "distilgpt2" %}selected{% endif %}>distilgpt2 – szybszy, mniej dokładny</option>
                <option value="gpt2" {% if model_name == "gpt2" %}selected{% endif %}>gpt2 – dokładniejszy, wolniejszy</option>
            </select>

            <div>
                <button type="submit">Analizuj</button>
                <button type="submit" name="clear" value="1">Zeruj wyniki</button>
                <a href="/logout" class="logout">Wyloguj</a>
            </div>

            {% if wynik %}
                <p class="result" style="color: {{ kolor }}">Wynik analizy: {{ wynik }}</p>
                <p>Perplexity: {{ perplexity }}</p>
                <p>Burstiness: {{ burstiness }}</p>
            {% endif %}
        </form>

        <footer>
            2025, Copyright(c), GB
        </footer>
    </div>
</body>
</html>
