<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Użytkownicy – AI Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        th, td {
            padding: 0.75rem;
            border: 1px solid #ddd;
        }
        .form-inline {
            display: flex;
            gap: 0.5rem;
        }
        input[type="number"] {
            width: 80px;
            padding: 0.3rem;
        }
        button {
            padding: 0.3rem 0.8rem;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-primary {
            background-color: #2ecc71;
        }
        a {
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lista użytkowników</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nazwa użytkownika</th>
                    <th>Tokeny</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td>{{ user.username }}</td>
                        <td>{{ user.tokens }}</td>
                        <td>
                            {% if user.username != 'admin' %}
                                <form method="POST" action="{{ url_for('update_tokens', user_id=user.id) }}" class="form-inline">
                                    <input type="number" name="tokens" min="0" value="{{ user.tokens }}" required>
                                    <button type="submit" class="btn btn-primary">Zapisz</button>
                                </form>
                                <form method="POST" action="{{ url_for('delete_user', user_id=user.id) }}" style="margin-top: 0.5rem;">
                                    <button class="btn btn-danger" type="submit" onclick="return confirm('Na pewno usunąć {{ user.username }}?')">Usuń</button>
                                </form>
                            {% else %}
                                <em>konto administratora</em>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('register') }}">➕ Dodaj użytkownika</a><br><br>
        <a href="{{ url_for('index') }}">← Powrót do analizy</a>
    </div>
</body>
</html>
