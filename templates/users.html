<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Użytkownicy – AI Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
        }
        tr:nth-child(even) {
            background-color: #f4f4f4;
        }
        .actions {
            text-align: right;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>Lista użytkowników</h1>
            <a href="{{ url_for('register') }}" class="btn btn-primary">Dodaj użytkownika</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nazwa użytkownika</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td>{{ user.username }}</td>
                        <td class="actions">
                            {% if user.username != 'admin' %}
                                <form method="POST" action="{{ url_for('delete_user', user_id=user.id) }}" style="display:inline;">
                                    <button class="btn btn-danger" type="submit" onclick="return confirm('Na pewno usunąć użytkownika {{ user.username }}?')">Usuń</button>
                                </form>
                            {% else %}
                                <em>konto administratora</em>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('index') }}" class="btn btn-primary">← Powrót</a>
    </div>
</body>
</html>
